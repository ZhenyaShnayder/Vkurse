<body>

        <form method="post" action="Post.php" enctype="multipart/form-data">
            <input type="hidden" id="vote" name="vote" value="0">
            <input type="hidden" id="comment" name="comment" value="0">
            <input type="text" class="text" placeholder="Заголовок поста" name="title" id="title">

                <button class="button" type="button" name="file" onclick="document.getElementById('file').click()">Загрузить файл</button>
