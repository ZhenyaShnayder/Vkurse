<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="styles.css">
	<meta charset=utf-8>
	<script src="post.js"></script>
	<title>Your post</title>
</head>
<body>
	<button class="back" onclick="window.location.href='/news'">⇐</button>
	<div class="all">
		<form method = "post" action="Post.php">
			<input type="hidden" id="vote" name="vote" value="0">
			<input type="hidden" id="comment" name="comment" value="0">
			<input type="text" class="text" placeholder="Заголовок поста" name="title" id="title">
			<textarea placeholder="Основной текст" name="post_text" id="post_text"></textarea>
			<div class="buttons">
				<button class="button" type="button" name = "file">Загрузить файл</button>
				<button class="button" type="button" onclick="toggleVote()" id="voteButton">Добавить голосование</button>
				<button class="button" type="button" name = "comment" onclick="toggleComment()" id="commentButton">Добавить возможность комментирования</button>
				<button class="button" type="submit" name = "public">Опубликовать</button>
			</div>
			<div id="voteMessage" style="display: none;">Возможность гололосования добавлена</div>
			<div id="commentMessage" style="display: none;">Возможность комментирования добавлена</div>
		</form>
	</div>
</body>
</html>
